<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151522"/>
      <stop offset="50%" stop-color="#0B0C13"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>

    <!-- Glass Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Primary Brand Gradient: Electric Rose to Solar Amber -->
    <linearGradient id="meetMindGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="35%" stop-color="#F43F5E"/>
      <stop offset="70%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Secondary Wave Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <!-- Glowing Record Lens Gradient -->
    <radialGradient id="recordGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FFE4E6"/>
      <stop offset="65%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </radialGradient>

    <!-- Radial Background Glow -->
    <radialGradient id="centerAura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#FB923C" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow for Mark -->
    <filter id="markDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#F43F5E" flood-opacity="0.4"/>
    </filter>

    <filter id="glowPulse" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#centerAura)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="114.5" fill="none" stroke="url(#rimGrad)" stroke-width="3"/>

  <!-- Master Monogram Group -->
  <g filter="url(#markDepth)">
    <!-- Outer Arch of 'M' -->
    <path d="M112 352 V216 C112 164 154 132 202 132 C240 132 256 162 256 190"
          fill="none"
          stroke="url(#meetMindGrad)"
          stroke-width="44"
          stroke-linecap="round"/>

    <path d="M400 352 V216 C400 164 358 132 310 132 C272 132 256 162 256 190"
          fill="none"
          stroke="url(#accentGrad)"
          stroke-width="44"
          stroke-linecap="round"/>

    <!-- Inner Chevron Audio-Wave of 'M' -->
    <path d="M192 232 L256 324 L320 232"
          fill="none"
          stroke="url(#meetMindGrad)"
          stroke-width="42"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Central Neural Mind / Active Recording Core -->
    <g filter="url(#glowPulse)">
      <!-- Radiant Halo Rings -->
      <circle cx="256" cy="188" r="34" fill="#F43F5E" opacity="0.28"/>
      <circle cx="256" cy="188" r="22" fill="#F43F5E" opacity="0.65"/>
      <!-- Precision Core Lens -->
      <circle cx="256" cy="188" r="14" fill="url(#recordGlow)"/>
      <circle cx="256" cy="188" r="6" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
