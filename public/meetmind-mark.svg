<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Primary Brand Gradient: Electric Rose to Solar Amber -->
    <linearGradient id="meetMindGradMark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="35%" stop-color="#F43F5E"/>
      <stop offset="70%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Secondary Wave Gradient -->
    <linearGradient id="accentGradMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <!-- Glowing Record Lens Gradient -->
    <radialGradient id="recordGlowMark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FFE4E6"/>
      <stop offset="65%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </radialGradient>

    <filter id="markDepthMark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#F43F5E" flood-opacity="0.4"/>
    </filter>

    <filter id="glowPulseMark" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#markDepthMark)">
    <!-- Outer Arch of 'M' -->
    <path d="M112 368 V216 C112 164 154 132 202 132 C240 132 256 162 256 190"
          fill="none"
          stroke="url(#meetMindGradMark)"
          stroke-width="46"
          stroke-linecap="round"/>

    <path d="M400 368 V216 C400 164 358 132 310 132 C272 132 256 162 256 190"
          fill="none"
          stroke="url(#accentGradMark)"
          stroke-width="46"
          stroke-linecap="round"/>

    <!-- Inner Chevron Audio-Wave of 'M' -->
    <path d="M192 236 L256 328 L320 236"
          fill="none"
          stroke="url(#meetMindGradMark)"
          stroke-width="44"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Central Neural Mind / Active Recording Core -->
    <g filter="url(#glowPulseMark)">
      <circle cx="256" cy="188" r="36" fill="#F43F5E" opacity="0.3"/>
      <circle cx="256" cy="188" r="23" fill="#F43F5E" opacity="0.7"/>
      <circle cx="256" cy="188" r="14" fill="url(#recordGlowMark)"/>
      <circle cx="256" cy="188" r="6" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
